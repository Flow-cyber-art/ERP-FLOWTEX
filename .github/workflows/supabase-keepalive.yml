name: Supabase keep-alive

# Darmowe projekty Supabase są wstrzymywane po tygodniu bez aktywności.
# Ten workflow co kilka dni wykonuje zapytanie do bazy, żeby tego uniknąć.
# Wymagane sekrety repo: SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Zapytanie do bazy Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Zapytanie o jeden rekord tabeli faktycznie trafia w bazę.
          # Treść odpowiedzi jest wypisywana, żeby łatwo było zdiagnozować błąd.
          code=$(curl -sS -o body.txt -w "%{http_code}" --retry 3 --retry-delay 5 \
            "$SUPABASE_URL/rest/v1/builds?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          head -c 500 body.txt; echo
          # 2xx = zapytanie przeszło. 42501 (brak uprawnień anon do tabeli) też dowodzi,
          # że zapytanie dotarło do Postgresa, więc liczy się jako aktywność bazy.
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then exit 0; fi
          grep -q '"code":"42501"' body.txt
